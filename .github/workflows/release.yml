# Releases packages of this repository. Tag format: <package>@<version>, e.g. env-check@1.0.0.
# This file name (release.yml) is the one to register as trusted publisher on npmjs.org.
name: Release

on:
  push:
    tags:
      - 'env-check@[0-9]+.[0-9]+.[0-9]+*'

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#*@}" >> "$GITHUB_OUTPUT"

  env-check:
    needs: version
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package-directory: packages/env-check
      publish-npmjs: true
      publish-github: true
