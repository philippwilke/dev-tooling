# Reusable workflow: builds, tests and publishes one npm package.
#
# - npmjs.org via trusted publishing (OIDC, provenance generated automatically).
#   Configure the trusted publisher on npmjs with the CALLER's workflow file name.
# - GitHub Packages with the caller's GITHUB_TOKEN.
# Publishing is skipped per registry when the version already exists there.
name: npm release

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish, semver without a leading "v".
        required: true
        type: string
      package-directory:
        description: Directory containing package.json, relative to the repository root.
        type: string
        default: .
      publish-npmjs:
        description: Publish to registry.npmjs.org (public, with provenance).
        type: boolean
        default: false
      publish-github:
        description: Publish to GitHub Packages (visibility follows the repository).
        type: boolean
        default: true
      node-version:
        type: string
        default: '24'
      npm-version:
        description: npm CLI version; trusted publishing needs 11.5.1 or later.
        type: string
        default: '11.21.3'
    secrets:
      npm-token:
        description: >-
          Bootstrap only. Granular npm token used for the FIRST npmjs.org publish of a new
          package, before a trusted publisher can be registered. Leave unset afterwards.
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.package-directory }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install pinned npm
        env:
          NPM_VERSION: ${{ inputs.npm-version }}
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate package and apply version
        env:
          OWNER: ${{ github.repository_owner }}
          PUBLISH_GITHUB: ${{ inputs.publish-github }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version."
            exit 1
          fi
          if [ "$(node -p "Boolean(require('./package.json').publishConfig?.registry)")" = "true" ]; then
            echo "::error::Remove publishConfig.registry from package.json; this workflow selects the registry."
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          scope=$(node -p "(require('./package.json').name.match(/^@[^/]+/) || [''])[0]")
          owner_scope="@${OWNER,,}"
          if [ "$PUBLISH_GITHUB" = "true" ] && [ "$scope" != "$owner_scope" ]; then
            echo "::error::GitHub Packages needs the scope $owner_scope, but the package is named $name."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          {
            echo "PACKAGE_NAME=$name"
            echo "PACKAGE_SCOPE=$scope"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile; nothing to install."; fi

      - name: Build and test
        run: |
          npm run build --if-present
          npm test --if-present

      - name: Publish to npmjs.org
        if: inputs.publish-npmjs
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail
          registry=https://registry.npmjs.org/
          args=(--registry="$registry")
          [ -n "$PACKAGE_SCOPE" ] && args+=("--${PACKAGE_SCOPE}:registry=$registry")
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            # Token publish: provenance must be requested explicitly (OIDC adds it automatically).
            echo "::warning::Publishing with a bootstrap token. Register a trusted publisher and delete the token afterwards."
            npmrc=$(mktemp)
            echo "//registry.npmjs.org/:_authToken=\${NPM_BOOTSTRAP_TOKEN}" > "$npmrc"
            export NPM_CONFIG_USERCONFIG="$npmrc"
            args+=(--provenance)
          fi
          if out=$(npm view "$PACKAGE_NAME@$VERSION" version "${args[@]}" 2>&1); then
            if [ "$out" = "$VERSION" ]; then
              echo "$PACKAGE_NAME@$VERSION already exists on npmjs.org; skipping."
              exit 0
            fi
          elif ! grep -q 'E404' <<<"$out"; then
            echo "::error::Could not query npmjs.org: $out"
            exit 1
          fi
          npm publish --access public "${args[@]}"

      - name: Publish to GitHub Packages
        if: inputs.publish-github
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry=https://npm.pkg.github.com/
          npmrc=$(mktemp)
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$npmrc"
          export NPM_CONFIG_USERCONFIG="$npmrc"
          args=(--registry="$registry" "--${PACKAGE_SCOPE}:registry=$registry")
          if out=$(npm view "$PACKAGE_NAME@$VERSION" version "${args[@]}" 2>&1); then
            if [ "$out" = "$VERSION" ]; then
              echo "$PACKAGE_NAME@$VERSION already exists on GitHub Packages; skipping."
              exit 0
            fi
          elif ! grep -q 'E404' <<<"$out"; then
            echo "::error::Could not query GitHub Packages: $out"
            exit 1
          fi
          npm publish "${args[@]}"
